[package]
name = "vexil"
version = "0.1.0"
description = "Vexil Local AI Search"
authors = ["you"]
edition = "2021"
default-run = "vexil"
# Required by tauri-plugin's build helper, which is what discovers the Swift
# package in `ios/` during `tauri ios init` / `tauri ios build`.
links = "vexil"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vexil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-plugin = { version = "2", features = ["build"] }
base64 = "0.22"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7.0.0"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
notify = "6"
regex = "1"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
opener = { version = "0.8.5", features = ["reveal"] }
ignore = "0.4.33"
sysinfo = "0.32"
log = "0.4"
tauri-plugin-wdio-webdriver = { version = "1.5.0", optional = true }
tauri-plugin-wdio = { version = "1.5.0", optional = true }
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
rand = "0.8"
zip = "9.0.5"
quick-xml = "0.42.0"
pdf-extract = "0.12.1"
ureq = "3.4.2"
semver = "1.0.28"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# unwind (not abort) so a malformed user file can't silently kill the process
# while document extraction runs; per-file catch_unwind guards the indexer
panic = "unwind"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

# Storage Access Framework (SAF) reading on Android. A picked folder is a
# `content://` document tree, not a readable path, so the indexer drives the
# App ContentResolver through `com.vexil.app.SafBridge` over JNI. `ndk-context`
# is the handle tao installs at startup with the JavaVM and the app Context.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# In-app updates are a desktop feature: mobile installs go through the store
# or a sideloaded APK, so the updater plugin is never built for those targets.
# The plugin's optional `zip` feature is off: we ship NSIS/MSI/AppImage/
# .app.tar.gz artifacts only, and tar unpacking on macOS/Linux comes from the
# plugin's unconditional target-scoped tar/flate2 deps. That also keeps the
# vulnerable zip 4.x from the updater (RustSec fix >= 9) out of our lockfile.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }

[target."cfg(target_os = \"ios\")".dependencies]
# `tauri-plugin`'s build helper reads DEP_TAURI_IOS_LIBRARY_PATH from tauri, so
# tauri has to be a real dependency on iOS for the Swift package to be linked.
tauri = { version = "2", features = ["wry"], default-features = false }
