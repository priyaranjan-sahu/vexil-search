[package]
name = "vexil"
version = "0.1.2"
description = "Vexil Local AI Search"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vexil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7.0.0"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
notify = "6"
regex = "1"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
opener = { version = "0.8.5", features = ["reveal"] }
ignore = "0.4.33"
tauri-plugin-wdio-webdriver = "1.4.0"
tauri-plugin-wdio = "1.4.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
