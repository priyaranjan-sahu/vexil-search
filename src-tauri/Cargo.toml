[package]
name = "vexil"
version = "0.1.0"
description = "Vexil Local AI Search"
authors = ["you"]
edition = "2021"
default-run = "vexil"
# Required by tauri-plugin's build helper, which is what discovers the Swift
# package in `ios/` during `tauri ios init` / `tauri ios build`.
links = "vexil"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vexil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-plugin = { version = "2", features = ["build"] }
base64 = "0.22"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7.0.0"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
notify = "6"
regex = "1"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
opener = { version = "0.8.5", features = ["reveal"] }
ignore = "0.4.33"
sysinfo = "0.32"
log = "0.4"
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }
tauri-plugin-wdio = { version = "1.4.0", optional = true }
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
rand = "0.8"
zip = "8.6.0"
quick-xml = "0.42.0"
pdf-extract = "0.12.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# unwind (not abort) so a malformed user file can't silently kill the process
# while document extraction runs; per-file catch_unwind guards the indexer
panic = "unwind"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[target."cfg(target_os = \"ios\")".dependencies]
# `tauri-plugin`'s build helper reads DEP_TAURI_IOS_LIBRARY_PATH from tauri, so
# tauri has to be a real dependency on iOS for the Swift package to be linked.
tauri = { version = "2", features = ["wry"], default-features = false }
