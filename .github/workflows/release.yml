name: Release
on:
  push:
    tags:
      - "latest"
  workflow_dispatch:

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.bump.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force latest tag
        id: bump
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            # Create or update the 'latest' tag
            git tag -f latest
            
            # Push the tag (this updates it if it exists)
            git push origin -f latest
            
            echo "tag_name=latest" >> $GITHUB_OUTPUT
          else
            # If triggered by a pushed tag, just output the pushed tag
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

  release:
    needs: prepare-release
    permissions:
      contents: write
    # Azure Artifact Signing (Azure Trusted Signing) credentials. Only consumed
    # on windows-latest; keep them in GitHub Secret store.
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install artifact-signing-cli (Windows signing)
        if: matrix.platform == 'windows-latest'
        run: cargo install artifact-signing-cli --version 0.11.0

      - name: Install Ubuntu dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install NPM dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare-release.outputs.tag_name }}
          releaseName: "Vexil Search ${{ needs.prepare-release.outputs.tag_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'windows-latest' && format('--config {0}/src-tauri/tauri.windows.conf.json', github.workspace) || matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}

      # Tauri's bundler only signs .exe/.dll via bundle.windows.signCommand
      # (overlay config above). The WiX .msi is signed here, and every Windows
      # deliverable is verified. A failure aborts the job, so the draft release
      # is never published with an unsigned installer.
      - name: Sign MSI and verify Windows deliverables
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          & "${{ github.workspace }}/scripts/sign-installers.ps1" -Root "${{ github.workspace }}"
