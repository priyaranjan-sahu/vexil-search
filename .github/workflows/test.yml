name: Automated Testing (E2E & Unit)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Private repo branch or tag to test (blank = master)."
        type: string
        required: false
        default: ""

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, macos-latest, windows-latest]
    
    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: priyaranjan-sahu/vexil
          ref: ${{ inputs.ref || 'refs/heads/master' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Ubuntu dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Install NPM dependencies
        run: npm ci

      - name: Run Backend Tests (Rust)
        run: cargo test
        working-directory: ./src-tauri

      - name: Run Frontend Tests (Vitest)
        run: npm run test:unit

      - name: Run E2E Tests (WebdriverIO)
        uses: coactions/setup-xvfb@v1
        with:
          run: npm run test:e2e
