name: Automated Testing (E2E & Unit)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Private repo branch or tag to test (blank = master)."
        type: string
        required: false
        default: ""

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: priyaranjan-sahu/vexil
          ref: ${{ inputs.ref || 'refs/heads/master' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Install Ubuntu dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Install NPM dependencies
        run: npm ci

      - name: Run Backend Tests (Rust)
        run: cargo test
        working-directory: ./src-tauri

      - name: Run Frontend Tests (Vitest)
        run: npm run test:unit

      # test:e2e builds the frontend itself and then compiles the debug binary
      # with the custom-protocol feature, so the app embeds dist/ instead of
      # pointing at the Vite dev server.
      - name: Run E2E Tests (WebdriverIO)
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1
        with:
          run: npm run test:e2e
