# Vexil license issuance worker
name = "vexil-licenses"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

# KV namespaces backing license issuance. These ids match the namespaces
# already bound on the deployed worker (CUSTOMERS/SEATS), so `npm run deploy`
# rebinds the same data instead of dropping every recorded customer and seat.
# Create new ones with: wrangler kv namespace create CUSTOMERS
[[kv_namespaces]]
binding = "CUSTOMERS"
id = "5a10d37dcdd04c11bfcf84748a2fd175"
preview_id = "5a10d37dcdd04c11bfcf84748a2fd175"

[[kv_namespaces]]
binding = "SEATS"
id = "45425161165e4af6864875d80274c2e7"
preview_id = "45425161165e4af6864875d80274c2e7"

[vars]
# "paddle" | "buymeacoffee" | "auto" (auto detects the provider by signature
# header; recommended as the default).
WEBHOOK_PROVIDER = "auto"
# Identifies the Buy Me a Coffee shop item that grants a Pro license. Matched
# against each purchased item's id or title (case-insensitive). Comma-separated
# for multiple items. Leave empty to fail closed: no BMAC purchase can grant Pro.
BMAC_PRO_PRODUCT_ID = ""
# Set to "true" to also map active BMAC memberships to Pro licenses (started/
# updated/cancelled/active webhooks). Disabled by default.
BMAC_SUPPORT_MEMBERSHIPS = "false"